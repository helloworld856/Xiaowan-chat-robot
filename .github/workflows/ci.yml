name: CI

on:
  push:
    branches: [main, codex/backend-updates, codex/frontend-framework]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: xiaowan-ci-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysql --protocol=tcp -h 127.0.0.1 -uroot -pxiaowan-ci-only -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: |
          test -n "$XIAOWAN_TEST_MYSQL_PORT"
          python -m unittest discover -s backend/tests -v
        env:
          XIAOWAN_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          XIAOWAN_TEST_MYSQL_PASSWORD: xiaowan-ci-only
      - run: bash -n deploy/xiaowan-update

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
