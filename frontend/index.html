<!DOCTYPE html>
<html lang="zh-CN" class="theme0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>来聊天吧</title>
    <link rel="icon" href="/ico/favicon.ico" type="image/x-icon">
    

    <link rel="stylesheet" href="src/styles/theme_color.css">
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/message.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/auth.css">
    <link rel="stylesheet" href="src/styles/profile.css">
</head>
<body>
    <div id="loading">
        <div class="typing-indicator">
            <div class="typing-circle"></div>
            <div class="typing-circle"></div>
            <div class="typing-circle"></div>
            <div class="typing-shadow"></div>
            <div class="typing-shadow"></div>
            <div class="typing-shadow"></div>
        </div>
    </div>
    <!-- 入口由会话探测结果决定，登录与注册复用这一页。 -->
    <section id="login-screen" aria-labelledby="login-title" hidden>
        <form id="login-form" class="login-card" method="post">
            <header class="login-heading">
                <h1 id="login-title">登录小晚</h1>
                <p class="login-description">登录后继续聊天</p>
            </header>
            <div class="login-fields">
                <div class="login-field">
                    <label for="login-username">用户名</label>
                    <input id="login-username" name="username" type="text" autocomplete="username" maxlength="64" required>
                </div>
                <div class="login-field">
                    <label for="login-password">密码</label>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="512" aria-describedby="login-error" required>
                </div>
            </div>
            <p id="login-error" class="login-error" role="alert"></p>
            <button id="login-submit" class="login-primary" type="submit">登录</button>
            <button id="open-register" class="login-switch" type="button">注册账号</button>
        </form>
        <form id="register-form" class="login-card" method="post" hidden>
            <header class="login-heading"><h1 id="register-title">注册账号</h1></header>
            <div class="login-fields">
                <div class="login-field">
                    <label for="register-username">用户名</label>
                    <input id="register-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" title="用户名须为 3–32 位英文字母、数字或下划线" required>
                </div>
                <div class="login-field">
                    <label for="register-password">密码</label>
                    <input id="register-password" name="password" type="password" autocomplete="new-password" aria-describedby="register-error" required>
                </div>
                <div class="login-field">
                    <label for="register-confirm-password">确认密码</label>
                    <input id="register-confirm-password" name="confirm_password" type="password" autocomplete="new-password" aria-describedby="register-error" required>
                </div>
            </div>
            <p id="register-error" class="login-error" role="alert"></p>
            <button id="register-submit" class="login-primary" type="submit">注册</button>
            <button id="open-login" class="login-switch" type="button">返回登录</button>
        </form>
    </section>

    <div id="app-shell" hidden inert>
    <!-- 侧边栏 -->
    <div id="sidebar-zone">
        <button class="sidebar-btn" type="button" title="聊天回顾" aria-label="打开聊天回顾" aria-expanded="false" aria-controls="chat-review">
            <svg class="arrow" viewBox="0 0 512 512">
                <path d="M233.4 105.4c12.5-12.5 32.8-12.5 45.3 0l192 192c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L256 173.3 86.6 342.6c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l192-192z"></path>
            </svg>
        </button>
        <aside class="sidebar" id="chat-review" aria-labelledby="review-title" inert>
            <div class="review-layout">
                <div class="review-header">
                    <h2 id="review-title">聊天回顾</h2>
                </div>
                <p class="review-description">查找当前页面中的对话</p>
                <label class="review-search-label" for="review-search">搜索聊天内容</label>
                <input id="review-search" type="search" placeholder="搜索你或小晚说过的话" autocomplete="off">
                <p id="review-count" role="status"></p>
                <div id="review-list" aria-label="对话列表"></div>
            </div>
        </aside>
    </div>

    <!-- 主聊天区 -->
    <main class="chat-layout">
        <!-- 欢迎语 -->
        <div id="title">
            <h1>你好</h1>
        </div>

        <!-- 聊天框 -->
        <div id="chat-container">
            <div id="chatBox"></div>
            <button id="comeToBottom" type="button" title="回到底部" aria-label="回到底部">
                <img src="/ico/arrow.png" alt="">
            </button>
        </div>

        <!-- 输入区 -->
        <div id="inputArea">
            <textarea autocomplete="off" id="userInput" rows="1" aria-label="聊天消息" placeholder="说点什么吧~"></textarea>
            <button class="sendbtn" type="button">发送</button>
        </div>
    </main>

    <!-- 菜单 -->
    <div id="menu-zone">
        <button id="menuBtn" type="button" title="菜单" aria-label="账户与设置" aria-expanded="false" aria-controls="menu">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="6" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="12" cy="18" r="2"/>
            </svg>
        </button>
        <div id="menu">
            <div class="account-info">当前账户：<span id="current-username"></span></div>
            <button class="value value1">
                <svg viewBox="0 0 16 16"><path d="m1.5 13v1a.5.5 0 0 0 .3379.4731 18.9718 18.9718 0 0 0 6.1621 1.0269 18.9629 18.9629 0 0 0 6.1621-1.0269.5.5 0 0 0 .3379-.4731v-1a6.5083 6.5083 0 0 0 -4.461-6.1676 3.5 3.5 0 1 0 -4.078 0 6.5083 6.5083 0 0 0 -4.461 6.1676zm4-9a2.5 2.5 0 1 1 2.5 2.5 2.5026 2.5026 0 0 1 -2.5-2.5zm2.5 3.5a5.5066 5.5066 0 0 1 5.5 5.5v.6392a18.08 18.08 0 0 1 -11 0v-.6392a5.5066 5.5066 0 0 1 5.5-5.5z" fill="currentColor"></path></svg>
                <span>个人资料</span>
            </button>
            <button class="value value2">
                <svg viewBox="0 0 32 32"><path d="m17.074 30h-2.148c-1.038 0-1.914-.811-1.994-1.846l-.125-1.635c-.687-.208-1.351-.484-1.985-.824l-1.246 1.067c-.788.677-1.98.631-2.715-.104l-1.52-1.52c-.734-.734-.78-1.927-.104-2.715l1.067-1.246c-.34-.635-.616-1.299-.824-1.985l-1.634-.125c-1.035-.079-1.846-.955-1.846-1.993v-2.148c0-1.038.811-1.914 1.846-1.994l1.635-.125c.208-.687.484-1.351.824-1.985l-1.068-1.247c-.676-.788-.631-1.98.104-2.715l1.52-1.52c.734-.734 1.927-.779 2.715-.104l1.246 1.067c.635-.34 1.299-.616 1.985-.824l.125-1.634c.08-1.034.956-1.845 1.994-1.845h2.148c1.038 0 1.914.811 1.994 1.846l.125 1.635c.687.208 1.351.484 1.985.824l1.246-1.067c.787-.676 1.98-.631 2.715.104l1.52 1.52c.734.734.78 1.927.104 2.715l-1.067 1.246c.34.635.616 1.299.824 1.985l1.634.125c1.035.079 1.846.955 1.846 1.993v2.148c0 1.038-.811 1.914-1.846 1.994l-1.635.125c-.208.687-.484 1.351-.824 1.985l1.067 1.246c.677.788.631 1.98-.104 2.715l-1.52 1.52c-.734.734-1.928.78-2.715.104l-1.246-1.067c-.635.34-1.299.616-1.985.824l-.125 1.634c-.079 1.035-.955 1.846-1.993 1.846zm-5.835-6.373c.848.53 1.768.912 2.734 1.135.426.099.739.462.772.898l.18 2.341 2.149-.001.18-2.34c.033-.437.347-.8.772-.898.967-.223 1.887-.604 2.734-1.135.371-.232.849-.197 1.181.089l1.784 1.529 1.52-1.52-1.529-1.784c-.285-.332-.321-.811-.089-1.181.53-.848.912-1.768 1.135-2.734.099-.426.462-.739.898-.772l2.341-.18h-.001v-2.148l-2.34-.18c-.437-.033-.8-.347-.898-.772-.223-.967-.604-1.887-1.135-2.734-.232-.37-.196-.849.089-1.181l1.529-1.784-1.52-1.52-1.784 1.529c-.332.286-.81.321-1.181.089-.848-.53-1.768-.912-2.734-1.135-.426-.099-.739-.462-.772-.898l-.18-2.341-2.148.001-.18 2.34c-.033.437-.347.8-.772.898-.967.223-1.887.604-2.734 1.135-.37.232-.849.197-1.181-.089l-1.785-1.529-1.52 1.52 1.529 1.784c.285.332.321.811.089 1.181-.53.848-.912 1.768-1.135 2.734-.099.426-.462.739-.898.772l-2.341.18.002 2.148 2.34.18c.437.033.8.347.898.772.223.967.604 1.887 1.135 2.734.232.37.196.849-.089 1.181l-1.529 1.784 1.52 1.52 1.784-1.529c.332-.287.813-.32 1.18-.089z" id="XMLID_1646_" fill="currentColor"></path><path d="m16 23c-3.859 0-7-3.141-7-7s3.141-7 7-7 7 3.141 7 7-3.141 7-7 7zm0-12c-2.757 0-5 2.243-5 5s2.243 5 5 5 5-2.243 5-5-2.243-5-5-5z" fill="currentColor" id="XMLID_1645_"></path></svg>
                <span>设置</span>
            </button>

            <button id="logout-btn" class="value" type="button">退出登录</button>
        </div>
    </div>
    <dialog id="profile-dialog" aria-labelledby="profile-title">
        <div class="profile-heading">
            <h2 id="profile-title">个人资料</h2>
            <button id="profile-close" class="profile-text-button" type="button">关闭</button>
        </div>
        <form id="profile-form">
            <fieldset id="profile-fields" disabled>
                <div class="profile-summary">
                    <img id="profile-preview" alt="当前头像" width="60" height="60">
                    <div><strong id="profile-display-name"></strong><p class="profile-account">登录账号：<span id="profile-username"></span></p></div>
                </div>
                <label class="profile-label" for="profile-nickname">昵称</label>
                <input id="profile-nickname" class="profile-input" maxlength="64" required autocomplete="nickname">
                <div class="profile-avatar-heading"><span class="profile-label">系统头像</span><button id="profile-default-avatar" class="profile-text-button" type="button">恢复默认</button></div>
                <div id="profile-avatars" role="group" aria-label="系统头像"></div>
                <button id="profile-open-password" class="profile-password-link" type="button">修改密码 <span aria-hidden="true">›</span></button>
            </fieldset>
            <p id="profile-status" class="profile-status" role="status"></p>
            <div class="profile-actions">
                <button id="profile-cancel" class="profile-secondary" type="button">取消</button>
                <button id="profile-save" class="profile-primary" type="submit" disabled>保存</button>
            </div>
        </form>
        <form id="profile-password-form" method="post" hidden>
            <fieldset id="profile-password-fields">
                <label class="profile-label" for="profile-current-password">当前密码</label>
                <input id="profile-current-password" class="profile-input" name="current_password" type="password" autocomplete="current-password" maxlength="512" required>
                <label class="profile-label" for="profile-new-password">新密码</label>
                <input id="profile-new-password" class="profile-input" name="new_password" type="password" autocomplete="new-password" aria-describedby="profile-password-status" required>
                <label class="profile-label" for="profile-confirm-password">确认新密码</label>
                <input id="profile-confirm-password" class="profile-input" name="confirm_password" type="password" autocomplete="new-password" aria-describedby="profile-password-status" required>
            </fieldset>
            <p id="profile-password-status" class="profile-status" role="status"></p>
            <div class="profile-actions">
                <button id="profile-password-back" class="profile-secondary" type="button">返回资料</button>
                <button id="profile-password-save" class="profile-primary" type="submit">修改并重新登录</button>
            </div>
        </form>
    </dialog>

    <dialog id="logout-dialog" role="alertdialog" aria-labelledby="logout-title" aria-describedby="logout-description">
        <h2 id="logout-title">确认退出登录？</h2>
        <p id="logout-description">退出后需要重新登录才能继续聊天。</p>
        <div class="logout-actions">
            <button id="logout-cancel" type="button" autofocus>取消</button>
            <button id="logout-confirm" type="button">退出登录</button>
        </div>
    </dialog>

    <!-- 设置界面 -->
    <dialog id="setting-container" aria-labelledby="settings-title">
        <div class="setting">
            <div class="setting-head">
                <span id="settings-title">设置</span>
                <button type="button" class="close-setting" aria-label="关闭设置" autofocus>
                    <svg viewBox="0 0 17 17" height="17" width="17">
                        <line x1="0" y1="0" x2="17" y2="17" stroke="currentColor" stroke-width="2"/>
                        <line x1="17" y1="0" x2="0" y2="17" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>
            <div class="setting-content">
                <!-- 模型信息展示区 -->
                <div id="model-info-view">
                    <h2>模型连接</h2>
                    <div class="info-item" data-model-admin hidden>
                        <label>接口地址：</label>
                        <span id="display-base-url">厂商默认地址</span>
                    </div>
                    <div class="info-item">
                        <label>模型厂商：</label>
                        <span id="display-merchant">-</span>
                    </div>
                    <div class="info-item">
                        <label>模型名称：</label>
                        <span id="display-model">-</span>
                    </div>
                    <div class="info-item">
                        <label>模型状态：</label>
                        <span id="display-model-status">未就绪</span>
                    </div>
                    <button type="button" id="open-modify-btn" class="modify-btn">修改模型配置</button>
                </div>

                <section id="preferences-panel">
                    <fieldset id="preferences-fields" disabled>
                        <legend>偏好</legend>
                        <div class="preference-row" id="theme-label">主题</div>
                        <div class="theme-select" role="radiogroup" aria-labelledby="theme-label">
                            <label><input type="radio" class="theme" name="themeRadio" value="theme0" checked><span>默认白</span></label>
                            <label><input type="radio" class="theme" name="themeRadio" value="theme1"><span>海阔天空</span></label>
                            <label><input type="radio" class="theme" name="themeRadio" value="theme2"><span>夏日海岸</span></label>
                            <label><input type="radio" class="theme" name="themeRadio" value="theme3"><span>樱雨绵绵</span></label>
                        </div>
                        <label class="preference-row" for="send-shortcut"><span>发送快捷键</span>
                            <select id="send-shortcut"><option value="enter">Enter 发送</option><option value="ctrl_enter">Ctrl+Enter 发送</option></select>
                        </label>
                    </fieldset>
                    <p id="preferences-status" role="status"></p>
                    <button type="button" id="reload-settings">重新读取设置</button>
                </section>

                <!-- 修改模型配置的弹窗 -->
                <dialog id="model-edit-modal" class="modal" aria-labelledby="open-modify-btn">
                    <div class="modal-content">
                        <!-- 脚本按账号角色启用对应字段，并分别处理探测和保存。 -->
                        <form id="model-config-form">
                            <div class="form-group">
                                <label for="modelSelect">选择模型厂商:</label>
                                <select id="modelSelect" autofocus>
                                    <option value="deepseek">deepseek</option>
                                    <option value="tongyi">通义千问</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="modelName">模型名:</label>
                                <input id="modelName" list="model-name-options" required placeholder="选择或输入模型名">
                                <datalist id="model-name-options"></datalist>
                            </div>
                            <div class="form-group" data-model-admin hidden>
                                <label for="model-base-url">接口地址:</label>
                                <input id="model-base-url" type="url" placeholder="留空使用厂商默认地址">
                            </div>
                            <div class="form-group" data-model-personal hidden>
                                <label for="model-api-key">API Key</label>
                                <input id="model-api-key" type="password" maxlength="1024" autocomplete="off" spellcheck="false">
                            </div>
                            <p class="settings-help" data-model-admin hidden>自定义地址需兼容 OpenAI 接口，填写完整 API 基础路径。密钥仍使用所选厂商的服务端配置。</p>
                            <p id="model-test-status" role="status"></p>
                            <div class="modal-btns">
                                <button type="button" id="cancel-modify-btn">取消</button>
                                <button type="button" id="test-model-btn">测试连接</button>
                                <button type="submit" id="submit-model-btn" class="model-submit">保存并切换</button>
                            </div>
                        </form>
                        <!-- 验证过程中的加载动画 -->
                        <div class="valid-loader"></div>
                    </div>
                </dialog>
            </div>
        </div>
    </dialog>

    <!-- 提示弹窗，就不使用浏览器的alert了 -->
     <dialog id="alert-window-container" role="alertdialog" aria-labelledby="alert-window-title" aria-describedby="alert-window-message">
        <div class="alert-window">
            <!-- 提示弹窗头 -->
            <div class="alert-window-header">
                <span id="alert-window-title">提示</span>
            </div>
            <div class="alert-window-content" role="alert">
                <p id="alert-window-message"></p>
            </div>
            <div class="alert-window-button">
                <button type="button">确定</button>
            </div>
        </div>
     </dialog>

    </div>
    <script type="module" src="src/ts/main.ts"></script>
</body>
</html>
