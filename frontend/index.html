<!DOCTYPE html>
<html lang="zh-CN" class="theme0">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>来聊天吧</title>
    <link rel="icon" href="/ico/favicon.ico?v=2" type="image/x-icon">

    <link rel="stylesheet" href="src/styles/theme_color.css">
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/message.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/auth.css">
    <link rel="stylesheet" href="src/styles/profile.css">
</head>
<body>
    <svg class="caret-filter-defs" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
            <filter id="text-caret" color-interpolation-filters="sRGB">
                <!-- 提取 caret-color 的纯蓝像素，着深灰色，并将原生光标向右加宽 1px。 -->
                <feColorMatrix type="matrix" result="bar" values="
                    0 0 0 0 0.16
                    0 0 0 0 0.16
                    0 0 0 0 0.16
                    -255 -255 255 0 -254"/>
                <feOffset in="bar" dx="1" result="extra"/>
                <feMerge>
                    <feMergeNode in="SourceGraphic"/>
                    <feMergeNode in="bar"/>
                    <feMergeNode in="extra"/>
                </feMerge>
            </filter>
        </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
</body>
</html>
